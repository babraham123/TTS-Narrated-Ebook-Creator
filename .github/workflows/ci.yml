name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# No image build: the CUDA base plus torch and Chatterbox outgrow a free runner's disk.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # uv installs the Python 3.12 that pyproject.toml requires.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      # ffprobe checks the audio's timing; epubcheck validates the EPUB for real.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg epubcheck
      # Rules and style are in ruff.toml.
      - run: uvx ruff@0.17.0 check .
      - run: uvx ruff@0.17.0 format --check .
      # The fake TTS backend needs neither the tts extra nor a GPU.
      - run: uv run --frozen pytest -rs
